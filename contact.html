<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | GOMA's LAB</title>
    <style>
        body {
            font-family: sans-serif;
            line-height: 1.6;
            text-align: center;
            padding: 50px 20px;
            color: #333;
        }

        .contact-box {
            max-width: 500px;
            margin: 0 auto;
            border: 1px solid #eee;
            padding: 30px;
            border-radius: 10px;
        }

        .btn-insta {
            display: inline-block;
            background: #e1306c;
            color: white;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 20px;
        }

        .btn-insta:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <div class="contact-box">
        <h1>Contact</h1>
        <p>お仕事のご依頼やお問い合わせは、<br>InstagramのDM（ダイレクトメッセージ）にて承っております。</p>
        <p>以下のボタンより、公式アカウントへ移動してください。</p>
        <a href="https://www.instagram.com/_gomagomanomori_/" class="btn-insta" target="_blank"
            rel="noopener">Instagramで連絡する</a>
    </div>
    <p style="margin-top: 20px;"><a href="/">トップページへ戻る</a></p>
</body>

</html>
